<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Questionário do Paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita de leitura (celular primeiro), uma etapa por tela, barra de navegação fixa no rodapé.
   Tokens herdados do Formulário Padrão (Prontuário Pré-Anestésico) para os dois parecerem do mesmo sistema. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#14201C; --muted:#56655F; --line:#D5DDD9; --line-strong:#B9C6C0;
  --accent:#0D6B53; --accent-ink:#FFFFFF; --accent-soft:#DDEFE8;
  --crit:#B42318; --crit-soft:#FCE9E7; --warn:#8A5300; --warn-soft:#FFF1D9; --info:#1D5A94; --info-soft:#E6EFF9; --ok:#1E6B3A; --ok-soft:#E3F3E8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2420; --ink:#E4ECE8; --muted:#98A9A2; --line:#2A3632; --line-strong:#3A4A44;
    --accent:#4FC49F; --accent-ink:#0B1A15; --accent-soft:#17332A;
    --crit:#FF8B7B; --crit-soft:#3A1B17; --warn:#F0B55C; --warn-soft:#33260F; --info:#8DB9EE; --info-soft:#172536; --ok:#7CD39B; --ok-soft:#16301F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1A2420; --ink:#E4ECE8; --muted:#98A9A2; --line:#2A3632; --line-strong:#3A4A44;
  --accent:#4FC49F; --accent-ink:#0B1A15; --accent-soft:#17332A;
  --crit:#FF8B7B; --crit-soft:#3A1B17; --warn:#F0B55C; --warn-soft:#33260F; --info:#8DB9EE; --info-soft:#172536; --ok:#7CD39B; --ok-soft:#16301F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 140px}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:12px 10px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.stepno{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{margin-top:10px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.demo{margin-top:10px;font-size:13px;padding:7px 11px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}

/* Etapa */
.step-h{padding-block:18px 6px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--cond);font-weight:600;font-size:clamp(27px,6vw,34px);line-height:1.12;margin:4px 0 8px;text-wrap:balance}
.intro{margin:0;color:var(--muted);max-width:60ch}
.qs{display:flex;flex-direction:column;gap:14px;margin-top:16px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.q.err{border-color:var(--crit)}
.q>fieldset{border:0;margin:0;padding:0;min-width:0}
.qt{display:block;font-weight:600;font-size:17px;line-height:1.35;margin:0 0 4px;padding:0}
.help{display:block;font-size:14.5px;color:var(--muted);margin:0 0 10px}
.opt-tag{font-weight:400;font-size:13px;color:var(--muted)}
.errmsg{margin:8px 0 0;font-size:14px;color:var(--crit);font-weight:500}
.subh{font-family:var(--cond);font-weight:600;font-size:19px;margin:10px 0 -4px;text-wrap:balance}
.note{font-size:14.5px;padding:12px 14px;border-radius:10px;background:var(--info-soft);color:var(--ink)}
.note b{color:var(--info)}

input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{
  width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;min-height:50px}
input:disabled{opacity:.45}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea{min-height:96px;resize:vertical}
.numrow{display:flex;align-items:center;gap:10px}
.numrow input{max-width:150px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.numrow span{color:var(--muted);font-size:15px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pair label{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--muted);min-width:0}

/* Opções grandes */
.opts{display:flex;flex-direction:column;gap:8px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts.inline .opt{flex:1 1 120px}
.opt{position:relative;display:flex;flex-direction:column}
.opt>label{display:flex;gap:12px;align-items:flex-start;min-height:50px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);cursor:pointer;line-height:1.35}
.opt input[type=radio],.opt input[type=checkbox]{width:22px;height:22px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.opt input:checked+span{font-weight:600}
.opt:has(input:checked)>label{border-color:var(--accent);background:var(--accent-soft)}
.opt.none>label{border-style:dashed}
.opt .det{margin-top:6px}
.opt .det input{min-height:46px;font-size:16px}

/* DASI: sim/não por linha */
.yn{display:flex;flex-direction:column}
.yn-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.yn-row:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 14px;min-width:62px;font-weight:500;min-height:46px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Linhas repetidas (cirurgias, remédios) */
.rows{display:flex;flex-direction:column;gap:10px}
.rowcard{border:1px solid var(--line-strong);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.rowcard-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.rowcard label{display:flex;flex-direction:column;gap:5px;font-size:14.5px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--crit);font-size:14px;padding:6px 4px;text-decoration:underline}
.addbtn{align-self:flex-start;border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:10px;padding:11px 16px;font-weight:600;min-height:48px}

/* Rodapé fixo */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:660px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:600;min-height:52px}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);font-weight:500}
.saved{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}

/* Boas-vindas */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px}
.welcome ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.resume{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--radius);background:var(--accent-soft)}
.resume .btns{display:flex;flex-wrap:wrap;gap:8px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
.termo-box{margin-top:10px;max-height:300px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--muted)}
.termo-box p{margin:0;max-width:60ch}
.termo-box b{color:var(--ink);font-weight:600}
.termo-box:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.termo-end{font-family:var(--mono);font-size:12px;text-align:center;padding-top:8px;border-top:1px dashed var(--line-strong)}
.termo-hint{margin:10px 0;font-size:14.5px;color:var(--info);font-weight:500}
.termo-hint.ok{color:var(--ok)}
.termo-hint.warn{color:var(--crit)}
.consent.locked{opacity:.55}
.consent.locked input{cursor:not-allowed}

details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;color:var(--info);font-size:15px;font-weight:500;padding:4px 0;min-height:32px}
.more-body{display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--muted);padding-top:4px}
.more-body p{margin:0;max-width:60ch}
.more-body b{color:var(--ink);font-weight:600}
.termo-ver{font-family:var(--mono);font-size:12px}

/* Campos agrupados (endereço, contato, plano) */
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fcell{grid-column:span 6;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcell.w2{grid-column:span 2}.fcell.w3{grid-column:span 3}.fcell.w4{grid-column:span 4}
.flbl{font-size:14.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:9px 15px;min-height:44px;font-size:15.5px}
.chipb.sm{min-height:38px;padding:6px 12px;font-size:14px}
.chipb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

/* Data de nascimento em três caixas */
.dob{display:flex;gap:10px}
.dobc{display:flex;flex-direction:column;gap:6px;flex:0 0 76px}
.dobc.y{flex:0 0 108px}
.dobc input{text-align:center;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;padding-inline:6px}
.dobout{margin:10px 0 0;font-size:15.5px;min-height:1.5em}
.dobout.ok{color:var(--ok);font-weight:600}
.dobout.bad{color:var(--crit);font-weight:500}
.consent input{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.demo-link{align-self:flex-start;border:0;background:none;color:var(--info);text-decoration:underline;font-size:14px;padding:4px 0}

/* Revisão */
.rev-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.rev-sec h2{margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--cond);font-weight:600;font-size:18px}
.rev-sec h2 button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-family:var(--sans);font-size:14px;font-weight:500}
.rev-sec dl{margin:0;padding:6px 16px 12px}
.rev-sec dt{font-size:14px;color:var(--muted);margin-top:10px}
.rev-sec dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.rev-empty{padding:12px 16px;color:var(--muted);font-size:15px;margin:0}

/* Fim */
.done{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.done .check{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;font-weight:700}
details.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:14px}
details.team summary{padding:14px 16px;cursor:pointer;font-weight:600}
.team-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.team-body p{margin:0;font-size:14.5px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{font-family:var(--mono);font-size:13px;padding:5px 10px;border-radius:8px;background:var(--accent-soft);font-variant-numeric:tabular-nums}
pre.json{margin:0;max-height:360px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.45;white-space:pre}
.copyrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copied{color:var(--ok);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
</style>
</head><body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Avaliação pré-anestésica<small>Questionário antes da consulta</small></div>
      <div class="stepno" id="stepno"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="demo" id="demo">Versão de teste: as respostas ficam só neste aparelho e ainda não são enviadas à equipe.</div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="nav" id="nav" aria-label="Navegação do questionário">
  <div class="nav-in">
    <button class="btn" id="btn-back" type="button">Voltar</button>
    <button class="btn primary" id="btn-next" type="button">Continuar</button>
  </div>
  <div class="saved" id="saved"></div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* =========================================================================
   Perguntas em linguagem leiga, cada uma ligada aos campos do Formulário Padrão.
   Tipos: text, tel, num, date, area, single, checks, rows, dasi, h (subtítulo), info.
   single.opts: [rótulo, conjunto]  → conjunto = { campo: valor }; "+campo" acrescenta a um campo de múltipla escolha.
   checks.items: { l: rótulo, k: id da condição (marca k e grava detalhe em k_det), m: opção do campo múltiplo q.mf, s: conjunto extra, d: texto de ajuda do detalhe (false = sem detalhe) }
   ========================================================================= */

var YES = 'Sim', NO = 'Não';
/* [rótulo para o paciente, valor da coluna "Tipo de anestesia" do Prontuário (opções: Raquianestesia, Peridural, Geral, Bloqueio, Local, Sedação)] */
var ANEST_TIPOS = [['Dormiu totalmente', 'Geral'], ['Tomou nas costas e as pernas ficaram dormentes', ''], ['Só o braço ou a perna ficou dormente', 'Bloqueio'], ['Ficou sonolento(a), com anestesia no local', 'Local; Sedação'], ['Não sei', '']];
var PLANOS = [['Unimed', 'UNIMED'], ['Planserv', 'PLANSERV'], ['Bradesco Saúde', 'BRADESCO'], ['Cassi', 'CASSI'], ['SulAmérica', 'SULAMÉRICA'], ['Plansul', 'PLANSUL'], ['Amil', 'AMIL'], ['Saúde Caixa', 'SAÚDE CAIXA'], ['Postal Saúde', 'POSTAL SAÚDE'], ['FUSEX (Exército)', 'FUSEX'], ['Camed', 'CAMED']];
function pad2m(n){ n = parseInt(n, 10); return (n < 10 ? '0' : '') + n; }
function ymTexto(a, m){
  a = parseInt(a, 10); m = parseInt(m, 10); var p = [];
  if (a > 0){ a = Math.min(a, 60); p.push(a + (a === 1 ? ' ano' : ' anos')); }
  if (m > 0){ m = Math.min(m, 11); p.push(m + (m === 1 ? ' mês' : ' meses')); }
  return p.length ? p.join(' e ') : ((a === 0 || m === 0) ? 'menos de 1 mês' : '');
}
function age(A){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(A.dn || ''); if (!m) return null; var b = new Date(+m[1], m[2]-1, +m[3]), t = new Date(); var a = t.getFullYear() - b.getFullYear(); if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--; return a >= 0 && a < 130 ? a : null; }
function pick(A, id){ var q = QI[id]; var i = A[id]; return (q && i !== undefined && i !== null && q.opts[i]) ? q.opts[i][0] : ''; }
function fem(A){ return pick(A, 'sexo') === 'Feminino'; }

var STEPS = [
{ id: 'inicio', kind: 'welcome', title: 'Antes de começar', qs: [
  { t: 'single', id: 'quem', q: 'Quem está respondendo?', req: 1, opts: [
    ['Eu, o próprio paciente', { informante: 'Paciente' }],
    ['Um familiar ou acompanhante, pelo paciente', { informante: 'Familiar / acompanhante' }],
    ['O responsável legal (paciente menor de idade ou que não pode responder)', { informante: 'Responsável legal' }]] },
  { t: 'fields', id: 'resp_quem', q: 'Sobre você, que está respondendo', when: function(A){ return A.quem === 1 || A.quem === 2; },
    cols: [{ k: 'nome', l: 'Seu nome', ac: 'name' }, { k: 'par', l: 'Parentesco com o paciente', opts: ['Filho(a)', 'Cônjuge', 'Pai / mãe', 'Irmão(ã)', 'Cuidador(a)', 'Outro'] }] }
]},

{ id: 'dados', title: 'Dados do paciente', intro: 'Usamos estes dados para identificar o paciente e entrar em contato, se precisar.', qs: [
  { t: 'text', id: 'nome', q: 'Nome completo', f: 'nome', req: 1, ac: 'name' },
  { t: 'single', id: 'usa_ns', q: 'Usa um nome diferente do que está no documento?', inline: 1, opts: [[NO], [YES]] },
  { t: 'text', id: 'nome_social', q: 'Nome social', help: 'O nome pelo qual prefere ser chamado(a).', f: 'nome_social', when: function(A){ return pick(A, 'usa_ns') === YES; } },
  { t: 'dob', id: 'dn', q: 'Data de nascimento', f: 'dn', req: 1 },
  { t: 'single', id: 'sexo', q: 'Sexo', help: 'Como consta no registro de nascimento. Alguns cálculos de risco dependem disso.', req: 1, inline: 1, f: 'sexo', opts: [['Feminino'], ['Masculino']] },
  { t: 'text', id: 'responsavel', q: 'Nome do responsável legal', f: 'responsavel', when: function(A){ var a = age(A); return a !== null && a < 18 && A.quem !== 2; } },
  { t: 'text', id: 'responsavel_parent', q: 'Parentesco ou vínculo do responsável', ph: 'mãe, pai, tutor, curador…', f: 'responsavel_parent', when: function(A){ return !!A.responsavel && A.quem !== 2; } },
  { t: 'tel', id: 'telefone', q: 'Telefone com WhatsApp', f: 'telefone', ph: '(73) 90000-0000', mask: 'tel' },
  { t: 'fields', id: 'emerg', q: 'Contato para emergência', help: 'Alguém próximo que possamos chamar, se precisar.',
    cols: [{ k: 'nome', l: 'Nome' }, { k: 'par', l: 'Parentesco', opts: ['Filho(a)', 'Cônjuge', 'Pai / mãe', 'Irmão(ã)', 'Amigo(a)', 'Outro'] }, { k: 'tel', l: 'Telefone', mask: 'tel', ph: '(73) 90000-0000' }],
    build: function(v, put){ var who = [clean(v.nome), v.par ? v.par.toLowerCase() : ''].filter(Boolean).join(', '); var s = [who, clean(v.tel)].filter(Boolean).join(' — '); if (s) put('contato_emerg', s); } },
  { t: 'single', id: 'estado_civil', q: 'Estado civil', f: 'estado_civil', opts: [['Solteiro(a)'], ['Casado(a) ou em união estável', { estado_civil: 'Casado(a) / união estável' }], ['Divorciado(a)'], ['Viúvo(a)']] },

    /* Colunas do Prontuário: Data (mm/aaaa) | Procedimento | Tipo de anestesia | Hospital | Intercorrências */
    row: function(r){
      var t = ANEST_TIPOS.filter(function(x){ return x[0] === r.tipo; })[0];
      var ano = r.ano_alt ? '' : clean(r.ano).replace(/\D/g, ''), mes = r.mes_alt ? '' : clean(r.mes).replace(/\D/g, '');
      var okAno = /^(19|20)\d\d$/.test(ano), okMes = +mes >= 1 && +mes <= 12;
      var data = okAno && okMes ? pad2m(mes) + '/' + ano : '';
      var proc = clean(r.proc);
      if (!data && okAno) proc += (proc ? ' ' : '') + '(' + ano + ')';
      if (t && t[0] === ANEST_TIPOS[1][0]) proc += (proc ? ' — ' : '') + 'anestesia nas costas (raqui ou peridural, a confirmar)';
      return [data, proc, t ? t[1] : '', clean(r.hosp), r.teve === YES ? (clean(r.prob) || 'Sim, sem detalhes') : (r.teve === NO ? 'Nenhuma' : '')];

    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);

      h('div', { 'class': 'stats' }, h('span', { 'class': 'stat' }, nCampos + ' campos preenchidos'), h('span', { 'class': 'stat' }, pkg.relato.length + ' respostas no relato'), h('span', { 'class': 'stat' }, (pkg.alertas.length) + ' pontos de atenção')),
      pkg.alertas.length ? h('div', { 'class': 'note' }, h('b', null, 'Pontos de atenção: '), pkg.alertas.join(' · ')) : null,
      pre,
      h('div', { 'class': 'copyrow' },
        h('button', { type: 'button', 'class': 'btn', onclick: function(){
          var ok = function(){ copied.hidden = false; setTimeout(function(){ copied.hidden = true; }, 1800); };
          try { navigator.clipboard.writeText(json).then(ok, selectPre); } catch (e){ selectPre(); }
        } }, 'Copiar dados'), copied))));
  function selectPre(){ var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  main.appendChild(h('button', { type: 'button', 'class': 'btn ghost', style: 'margin-top:14px', onclick: function(){ isDemo = false; A = {}; consent = false; consentAt = ''; termoLido = false; termoLidoEm = ''; wipe(); $('demo').textContent = DEMO_TXT; showStep(0); } }, isDemo ? 'Sair do exemplo' : 'Responder por outro paciente'));
  $('nav').hidden = true;
  if (!isDemo) wipe();
  progress(); window.scrollTo(0, 0);
}

showDone = (function(orig){ return function(){

/* ---------- Pacote de dados para o Formulário Padrão ---------- */
function build(){
  var out = {}, relato = [], sys = {}, alertas = [], obs = [];
  function put(f, v){ if (v === undefined || v === null || v === '') return; if (typeof v === 'string' && typeof out[f] === 'string' && out[f] && out[f] !== v) out[f] += '; ' + v; else out[f] = v; }
  function addM(f, v){ if (!v) return; out[f] = out[f] || []; if (out[f].indexOf(v) < 0) out[f].push(v); }
  function setK(k, det){ out[k] = true; if (det) put(k + '_det', det); }
  function applySet(s){ if (!s) return; Object.keys(s).forEach(function(k){ if (k[0] === '+') addM(k.slice(1), s[k]); else if (s[k] === true) out[k] = true; else put(k, s[k]); }); }

  STEPS.forEach(function(s){
    s.qs.forEach(function(q){
      if (!qVisible(q)) return;
      var v = A[q.id], t = ansText(q);
      if (t) relato.push({ etapa: s.title, pergunta: q.q, resposta: t });
      if (q.t === 'text' || q.t === 'tel' || q.t === 'area' || q.t === 'date' || q.t === 'dob'){
        if (q.f && clean(v)) put(q.f, q.fmt === 'br' ? dBR(v) : clean(v));
      } else if (q.t === 'fields'){
        if (v && q.build) q.build(v, put, out);
      } else if (q.t === 'single'){
        if (v === undefined || v === null || !q.opts[v]) return;
        var o = q.opts[v];
        if (o[1]) applySet(o[1]); else if (q.f) put(q.f, o[0]);
      } else if (q.t === 'nums'){
        q.cols.forEach(function(c){ if (c.f && v && clean(v[c.k])) put(c.f, clean(v[c.k]).replace(',', '.')); });
      } else if (q.t === 'checks'){
        if (!v) return;
        if (q.sys){ sys[q.sys] = sys[q.sys] || { lists: 0, none: 0, any: false }; sys[q.sys].lists++; if (v.none) sys[q.sys].none++; }
        var parts = [];
        q.items.forEach(function(it, i){
          if (!v.on[i]) return;
          var det = it.d === false ? '' : clean(v.det[i]);
          var kdet = it.dp ? it.dp + (det ? ': ' + det : '') : det;
          if (it.k){ setK(it.k, kdet); if (q.sys && !it.nosys) sys[q.sys].any = true; }
          if (it.m && q.mf){ addM(q.mf, it.m); if (it.m === 'Outro' && det) put(q.mf + '_outro', det); }
          if (it.txt) obs.push(it.txt + ': ' + (det || it.l));
          if (it.s) applySet(it.s);
          if (q.to) parts.push(it.v + (det ? ' (' + det + ')' : ''));
          if (q.rowsTo && det && it.a){ out[q.rowsTo] = out[q.rowsTo] || []; out[q.rowsTo].push([it.a, '', '', det, '']); }
          if (q.id === 'alerg_esp'){ out.alergia_tab = out.alergia_tab || []; out.alergia_tab.push([it.a, det, '', '']); }
        });
        if (q.to && parts.length) put(q.to, parts.join('; '));
      } else if (q.t === 'rows'){
        if (!v || !q.f) return;
        var rows = v.map(q.row).filter(function(r){ return r.some(function(x){ return clean(x); }); });
        if (rows.length){ out[q.f] = (rows).concat(out[q.f] || []); }
      } else if (q.t === 'dasi'){
        if (!v) return;
        q.items.forEach(function(it){ if (v[it[0]] === YES) out[it[0]] = true; });
      }
    });
  });

  /* Quem respondeu: nome e parentesco completam o "Informante"; o responsável legal preenche os campos do responsável */
  var rq = A.resp_quem;
  if (qVisible(QI.resp_quem) && rq && (clean(rq.nome) || rq.par)){
    out.informante = (out.informante || '') + ' — ' + [clean(rq.nome), rq.par ? rq.par.toLowerCase() : ''].filter(Boolean).join(', ');
    if (A.quem === 2){ if (clean(rq.nome)) out.responsavel = clean(rq.nome); if (rq.par) out.responsavel_parent = rq.par; }
  }
  /* Adornos (piercing, cílios, unhas): vão para "Outros dispositivos" e, se na boca ou rosto, para a condição dentária */
  var ador = [];
  if (pick(A, 'piercing') === YES){
    var po = A.piercing_onde, locs = [];
    if (po && po.on) QI.piercing_onde.items.forEach(function(it, i){ if (po.on[i]) locs.push(it.l.toLowerCase()); });
    ador.push('piercing' + (locs.length ? ' (' + locs.join(', ') + ')' : ''));
    if (po && po.on && (po.on[0] || po.on[1] || po.on[2])) addM('dent', 'Piercing oral ou facial');
  }
  if (pick(A, 'cilios') === YES) ador.push('cílios artificiais');
  if (pick(A, 'unhas') === YES) ador.push('unhas de gel / acrílico');
  if (ador.length){ obs.push('Adornos: ' + ador.join('; ')); alertas.push('Adornos a retirar ou proteger: ' + ador.join(', ')); }
  /* Comunicação: o Prontuário aceita uma opção; com mais de uma (ou com detalhe), vai como "Outro" com a descrição */
  var cq = A.comunic;
  if (qVisible(QI.comunic) && cq && cq.on && !cq.none){
    var cSel = QI.comunic.items.filter(function(it, i){ return cq.on[i]; });
    if (cSel.length === 1 && cSel[0].cm !== 'Outro' && !clean(cq.det[QI.comunic.items.indexOf(cSel[0])])) out.comunicacao = cSel[0].cm;
    else if (cSel.length){
      out.comunicacao = 'Outro';
      out.comunicacao_outro = cSel.map(function(it){ var d = clean(cq.det[QI.comunic.items.indexOf(it)]); return it.v + (d ? ' (' + d + ')' : ''); }).join('; ');
    }
  }
  /* Plano de saúde fora da lista e carteirinha */
  if (qVisible(QI.carteirinha)){
    var mat = [];
    if (pick(A, 'plano_nome') === 'Outro plano' && clean(A.plano_outro)) mat.push('Plano ' + clean(A.plano_outro));
    if (clean(A.carteirinha)) mat.push(clean(A.carteirinha));
    if (mat.length) out.convenio_mat = mat.join(' — nº ');
  }
  /* Tabagismo: "Parou há" no formato do Prontuário (anos e meses) */
  var tp = A.tab_parou;
  if (qVisible(QI.tab_parou) && tp && (clean(tp.a) || clean(tp.m))){ var ym = ymTexto(clean(tp.a) || 0, clean(tp.m) || 0); if (ym) out.tab_parou = ym; }
  /* Abstinência alcoólica: registrada junto ao tipo de bebida */
  if (qVisible(QI.alcool_abst) && pick(A, 'alcool_abst') === YES) put('alcool_tipo', 'relata mal-estar (tremor, suor, agitação) ao ficar sem beber');
  /* "Nega" do sistema: só quando todas as listas daquele sistema foram respondidas com "nenhum" */
  Object.keys(sys).forEach(function(k){ var x = sys[k]; if (!x.any && x.none === x.lists) out[k + '_nega'] = true; });
  /* Alergias marcadas implicam status "Sim" */
  if (out.alergia_tab && out.alergia_tab.length) out.alergia_status = 'Sim';
  /* Remédios informados implicam uso */
  if (out.meds_tab && out.meds_tab.length && !out.meds_status) out.meds_status = 'Sim';
  var nMeds = (A.meds || []).filter(function(r){ return clean(r.n); }).length;
  if (nMeds >= 5 && age(A) !== null && age(A) >= 65) addM('geriatria', 'Polifarmácia (≥ 5 medicamentos)');
  /* Tabagismo: "Parou há" */
  /* Gestações */
  var g = A.gpa_n;
  if (qVisible(QI.gpa_n) && g && (clean(g.g) || clean(g.pn) || clean(g.pc) || clean(g.ab))){
    var n = function(x){ return parseInt(clean(x), 10) || 0; };
    var pc = n(g.pc);
    out.gpa = 'G' + n(g.g) + ' P' + (n(g.pn) + pc) + (pc ? ' (' + pc + ' cesárea' + (pc > 1 ? 's' : '') + ')' : '') + ' A' + n(g.ab);
    if (pc){ out.cesarea = true; out.cesarea_det = String(pc); }
    if (n(g.g)) put('sensibilizacao', n(g.g) + ' gestação(ões)');
  }
  if (clean(A.menop_idade) && out.menopausa) put('menopausa_det', 'aos ' + clean(A.menop_idade).replace(/\D+$/, '') + ' anos');
  /* Texto livre do paciente vai para "Outras doenças e observações" */
  var extras = obs.slice();
  if (clean(A.exames_feitos)) extras.push('Exames informados pelo paciente: ' + clean(A.exames_feitos));
  if (qVisible(QI.acomp) && A.acomp !== undefined) extras.push('Acompanhante adulto no dia: ' + QI.acomp.opts[A.acomp][0]);
  if (clean(A.duvidas)) extras.push('Dúvidas ou medos sobre a anestesia: ' + clean(A.duvidas));
  if (clean(A.algo_mais)) extras.push('Relato do paciente: ' + clean(A.algo_mais));
  if (extras.length) put('outras_doencas', extras.join('\n'));
  if (pick(A, 'risco_card') === 'Ainda vou passar') put('pendencias', 'Avaliação cardiológica (paciente informa que ainda vai passar)');

  /* Pontos de atenção para a triagem (não substituem os alertas do Formulário Padrão) */
  var M = out.meds_classes || [];
  if (M.some(function(x){ return /GLP-1/.test(x); })) alertas.push('Agonista GLP-1 / tirzepatida');
  if (M.some(function(x){ return /Varfarina|Anticoagulante|Heparina|Clopidogrel/.test(x); })) alertas.push('Anticoagulante ou antiagregante');
  if (M.some(function(x){ return /iSGLT2/.test(x); })) alertas.push('iSGLT2');
  if (out.c_hm || out.f_hm) alertas.push('Suspeita de hipertermia maligna');
  if (out.c_vad) alertas.push('Via aérea difícil prévia');
  if (out.a_latex) alertas.push('Alergia ao látex');
  if (out.alergia_status === 'Sim') alertas.push('Alergias informadas');
  if (out.p_mp || out.p_cdi) alertas.push('Marca-passo / CDI');
  if (out.gestante || out.poss_gest) alertas.push('Gestação atual ou possível');
  if (out.ivas || out.sindr_gripal || out.inf_ativa) alertas.push('Infecção respiratória ou febre recente');
  if (out.dor_tor) alertas.push('Dor no peito');
  if (out.aceita_transf && out.aceita_transf !== 'Sim') alertas.push('Restrição a transfusão');
  if (out.dialise) alertas.push('Diálise');

  return {
    formato: 'prontuario-pre-anestesico/questionario-paciente@1',
    gerado_em: new Date().toISOString(),
    exemplo: isDemo || undefined,
    informante: out.informante || '',
    consentimento: { aceito: !!(consent && termoLido), versao: TERMO.versao, aceito_em: consentAt || null, termo_lido_ate_o_fim: !!termoLido, termo_lido_em: termoLidoEm || null, controlador: 'SASB – Serviço de Anestesiologia Sul Bahia Ltda.' },
    campos: out,
    alertas: alertas,
    relato: relato
  };
}

$('btn-next').addEventListener('click', function(){
  if (phase === 'review'){ showDone(); return; }
  if (!validate()) return;
  var n = nextVisible(cur);
  if (n === -1) showReview(); else showStep(n);
});
$('btn-back').addEventListener('click', function(){
  if (phase === 'review'){ var last = -1; for (var j = STEPS.length - 1; j >= 0; j--) if (!STEPS[j].when || STEPS[j].when(A)){ last = j; break; } showStep(last); return; }
  var p = prevVisible(cur); if (p > -1) showStep(p);
});

function iniciarConvite(){
  if (!window.supabase){ telaConv('rede', function(){ location.reload(); }); return; }
  SBQ = window.supabase.createClient(SBQ_CFG.url, SBQ_CFG.chave, { auth: { persistSession: false, autoRefreshToken: false } });
  $('main').innerHTML = ''; $('main').appendChild(h('div', { 'class': 'done' }, h('p', { style: 'margin:0' }, 'Carregando o questionário…')));
  SBQ.rpc('questionario_abrir', { p_token: CONV.token }).then(function(r){
    var d = r && r.data;
    if (r.error || !d){ telaConv('rede', iniciarConvite); return; }
    if (d.erro){ telaConv(d.erro); return; }
    CONV.info = d;
    if (d.estado && d.estado.A && !load()){ try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, d.estado, { t: Date.now() }))); } catch (e){} }
    var ctx = [d.instituicao ? 'no ' + d.instituicao : '', d.data_cirurgia ? 'em ' + dBR(d.data_cirurgia) : ''].filter(Boolean).join(' ');
    $('demo').textContent = (d.primeiro_nome ? 'Olá, ' + d.primeiro_nome + '! ' : '') + 'Questionário pré-anestésico' + (ctx ? ' para a sua cirurgia ' + ctx : '') + '. As respostas vão direto para a equipe de anestesia' + (d.expira_em ? ' (link válido até ' + new Date(d.expira_em).toLocaleDateString('pt-BR') + ')' : '') + '.';
    $('nav').hidden = false;
    SBQ.rpc('dados_publicos').then(function(x){ var p = x && x.data; if (p && p.contato) TERMO.contato = p.contato; }, function(){}).then(function(){ showStep(0); });
  }, function(){ telaConv('rede', iniciarConvite); });
}
if (CONV) iniciarConvite(); else showStep(0);
})();
